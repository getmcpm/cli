<svg width="100%" viewBox="30 142 620 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="mcpm — runtime guard for MCP">
  <title>mcpm — runtime guard for MCP</title>

  <!--
    DARK BANNER.

    Deliberately carries NO version string. The previous banner hardcoded one,
    which silently went six releases stale; the npm badge rendered directly
    beneath this image already shows the live version. Nothing in this file
    should need touching on a release.

    Fonts are declared as real stacks, not a CSS custom property. GitHub renders
    this SVG standalone, where such a variable has nothing to resolve
    against and the text falls back to the default serif.
  -->

  <rect x="40" y="152" width="600" height="100" rx="12" fill="#0F172A" stroke="#1E293B" stroke-width="0.5"/>

  <!-- Icon: the relay sitting between two endpoints — traffic inspected in transit -->
  <g stroke="#FFFFFF" stroke-width="1.4" stroke-opacity="0.45">
    <rect x="60" y="166" width="68" height="68" rx="14" fill="#0D9488" stroke="none"/>
    <line x1="74" y1="180" x2="74" y2="224"/>
    <line x1="116" y1="180" x2="116" y2="224"/>
    <line x1="74" y1="180" x2="84" y2="200"/>
    <line x1="84" y1="200" x2="95" y2="188"/>
    <line x1="95" y1="188" x2="106" y2="200"/>
    <line x1="106" y1="200" x2="116" y2="180"/>
  </g>
  <g fill="#FFFFFF">
    <circle cx="74" cy="180" r="4"/>
    <circle cx="74" cy="224" r="4"/>
    <circle cx="116" cy="180" r="4"/>
    <circle cx="116" cy="224" r="4"/>
  </g>
  <g fill="#FFFFFF" fill-opacity="0.85">
    <circle cx="84" cy="200" r="2.8"/>
    <circle cx="95" cy="188" r="2.8"/>
    <circle cx="106" cy="200" r="2.8"/>
  </g>

  <!-- Wordmark -->
  <text x="144" y="208" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, system-ui, sans-serif"
        font-size="40" font-weight="500" letter-spacing="2" fill="#F8FAFC">mcpm</text>

  <!-- Tagline — leads with the guard; the package manager is the on-ramp -->
  <text x="146" y="229" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace"
        font-size="11.5" fill="#94A3B8">runtime guard for MCP · @getmcpm</text>

  <!-- Pills — only claims that do not rot -->
  <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" text-anchor="middle">
    <rect x="440" y="174" width="106" height="20" rx="10" fill="#134E4A" stroke="#0F766E" stroke-width="0.5"/>
    <text x="493" y="188" fill="#2DD4BF">local-first</text>

    <rect x="554" y="174" width="46" height="20" rx="10" fill="#1E293B" stroke="#334155" stroke-width="0.5"/>
    <text x="577" y="188" fill="#94A3B8">MIT</text>

    <rect x="440" y="202" width="160" height="20" rx="10" fill="#1E293B" stroke="#334155" stroke-width="0.5"/>
    <text x="520" y="216" fill="#94A3B8">guard + package manager</text>
  </g>
</svg>
