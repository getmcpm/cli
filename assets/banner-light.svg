<svg width="100%" viewBox="30 10 620 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="mcpm — runtime guard for MCP">
  <title>mcpm — runtime guard for MCP</title>

  <!--
    LIGHT BANNER.

    Deliberately carries NO version string. The previous banner hardcoded one,
    which silently went six releases stale; the npm badge rendered directly
    beneath this image already shows the live version. Nothing in this file
    should need touching on a release.

    Fonts are declared as real stacks, not a CSS custom property. GitHub renders
    this SVG standalone, where such a variable has nothing to resolve
    against and the text falls back to the default serif.
  -->

  <rect x="40" y="20" width="600" height="100" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="0.5"/>

  <!-- Icon: the relay sitting between two endpoints — traffic inspected in transit -->
  <g stroke="#FFFFFF" stroke-width="1.4" stroke-opacity="0.45">
    <rect x="60" y="34" width="68" height="68" rx="14" fill="#0D9488" stroke="none"/>
    <line x1="74" y1="48" x2="74" y2="92"/>
    <line x1="116" y1="48" x2="116" y2="92"/>
    <line x1="74" y1="48" x2="84" y2="68"/>
    <line x1="84" y1="68" x2="95" y2="56"/>
    <line x1="95" y1="56" x2="106" y2="68"/>
    <line x1="106" y1="68" x2="116" y2="48"/>
  </g>
  <g fill="#FFFFFF">
    <circle cx="74" cy="48" r="4"/>
    <circle cx="74" cy="92" r="4"/>
    <circle cx="116" cy="48" r="4"/>
    <circle cx="116" cy="92" r="4"/>
  </g>
  <g fill="#FFFFFF" fill-opacity="0.85">
    <circle cx="84" cy="68" r="2.8"/>
    <circle cx="95" cy="56" r="2.8"/>
    <circle cx="106" cy="68" r="2.8"/>
  </g>

  <!-- Wordmark -->
  <text x="144" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, system-ui, sans-serif"
        font-size="40" font-weight="500" letter-spacing="2" fill="#0F172A">mcpm</text>

  <!-- Tagline — leads with the guard; the package manager is the on-ramp -->
  <text x="146" y="97" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace"
        font-size="11.5" fill="#64748B">runtime guard for MCP · @getmcpm</text>

  <!-- Pills — only claims that do not rot -->
  <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" text-anchor="middle">
    <rect x="440" y="42" width="106" height="20" rx="10" fill="#CCFBF1" stroke="#99F6E4" stroke-width="0.5"/>
    <text x="493" y="56" fill="#0F766E">local-first</text>

    <rect x="554" y="42" width="46" height="20" rx="10" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="0.5"/>
    <text x="577" y="56" fill="#64748B">MIT</text>

    <rect x="440" y="70" width="160" height="20" rx="10" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="0.5"/>
    <text x="520" y="84" fill="#64748B">guard + package manager</text>
  </g>
</svg>
