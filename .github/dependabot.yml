# Dependabot — keep dependencies and pinned GitHub Actions patched. (security #31)
version: 2
updates:
  # Pinned action SHAs in ci.yml / publish.yml — get PRs when a new release
  # is available so they don't silently drift out of date.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies", "ci"]

  # npm dependencies.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels: ["dependencies"]
    ignore:
      # TypeScript majors are held: the parked PRs (#57, #103) proposed 6.x and
      # failed `tsc --noEmit`. npm `latest` has since moved to 7.x, so the deferred
      # migration is now 5.9 -> 7, not 5.9 -> 6. Neither was re-measured here.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # @types/node tracks the engines.node FLOOR (22) on purpose, so `tsc` refuses
      # APIs a Node 22 user would not have. It is NOT held back by breakage: the
      # compiled sources typecheck clean against @types/node 22, 24, 25 and 26
      # (tsconfig.json excludes `**/*.test.ts`), and CI re-runs the typecheck on
      # each matrix leg against the typings for that leg's Node, so the majors CI
      # builds on are covered without moving the floor. Raising this pin would
      # silently give up the floor guarantee.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      # Batch low-risk dev tooling updates into one PR to cut noise.
      dev-dependencies:
        dependency-type: "development"
