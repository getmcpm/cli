name: Publish

on:
  push:
    tags: ['v*']

# Least-privilege default for the workflow. The publish job below explicitly
# opts into exactly what it needs (contents: write for the GitHub Release,
# id-token: write for npm provenance), which fully overrides this default for
# that job — so publishing is unaffected; any other/future step defaults to read.
permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Set version from git tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Publishing version: $VERSION"
          npm pkg set version="$VERSION"
          # Stamp the SAME version into the MCP Registry manifest. Both files are
          # derived from the tag; nothing is hand-maintained. See the script's
          # header for why this is not the upstream docs' single-field jq line.
          node scripts/stamp-server-json.mjs "$VERSION"

      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run build
      - run: pnpm run test

      # PRE-PUBLISH GATE: pack the tarball, install it into a clean project, and
      # smoke-run the real `mcpm` binary. Source tests pass on a broken pack —
      # this exercises the exact bytes users get (bin, files:["dist"], prod dep
      # resolution + engines, the bundled Sigstore trusted root, lazy imports).
      # Fail-closed: a broken artifact aborts here, before `pnpm publish`.
      - name: Dogfood the packed artifact (pre-publish gate)
        run: pnpm run dogfood:release

      - run: pnpm publish --no-git-checks --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # SBOM generation runs AFTER publish and is best-effort, so a SBOM-tool
      # hiccup can never block the npm release. If it fails, the release is still
      # created below (just without the asset) and the workflow stays green.
      - name: Generate CycloneDX SBOM
        continue-on-error: true
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          format: cyclonedx-json
          output-file: mcpm.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Create GitHub Release + attach SBOM
        env:
          GH_TOKEN: ${{ github.token }}
        # Attach the SBOM AT CREATION TIME. GitHub immutable releases seal a
        # release's assets on creation and reject any later `gh release upload`
        # with HTTP 422, so the SBOM must be passed to `gh release create` as a
        # positional asset — not uploaded in a follow-up step. Idempotent: a
        # release may already exist (manual create, or a re-run); we don't fail
        # the publish, but we also can't amend an immutable one.
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists — skipping (immutable releases can't be amended)."
          elif [ -f mcpm.cdx.json ]; then
            gh release create "$GITHUB_REF_NAME" mcpm.cdx.json --generate-notes --title "$GITHUB_REF_NAME"
          else
            echo "No SBOM produced — creating release without asset."
            gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME"
          fi

      # ---------------------------------------------------------------------
      # Official MCP Registry (registry.modelcontextprotocol.io).
      #
      # This runs LAST and is deliberately NOT continue-on-error. Before this
      # step existed the listing was published by hand exactly twice, on
      # 2026-03-30, and then drifted for 43 releases: it advertised v0.1.3 while
      # npm served v0.30.0, so anyone resolving mcpm THROUGH the registry got a
      # build that still probed the unregistered `@invariantlabs` npm scope —
      # the fetch-execute vector closed in v0.28.0. A supply-chain tool cannot
      # ship a stale pointer to its own known-vulnerable build.
      #
      # Ordering: npm publish and the GitHub Release complete first, so a
      # registry-side outage cannot strand those. It then FAILS THE RUN rather
      # than warning, because a silent skip is the exact failure mode being
      # fixed — a red workflow is re-runnable, an unnoticed skip is not.
      # ---------------------------------------------------------------------
      - name: Install mcp-publisher (pinned + checksum-verified)
        env:
          # Pinned by tag, not `releases/latest`, and checksum-verified: this
          # workflow SHA-pins every action, so piping a moving `latest` tarball
          # into tar would be the one unpinned fetch in the release path.
          MCP_PUBLISHER_VERSION: v1.8.1
          MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
        run: |
          set -euo pipefail
          curl -fsSL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher

      - name: Validate server.json
        run: ./mcp-publisher validate

      # OIDC — no secret to store or rotate. Reuses the `id-token: write`
      # permission already granted above for npm provenance.
      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        run: ./mcp-publisher publish
