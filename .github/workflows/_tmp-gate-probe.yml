# TEMPORARY — deleted before merge. Runs the publish.yml `dogfood` job body verbatim
# (sliced from that file, not hand-copied) on a branch push, because publish.yml itself
# only triggers on a v* tag and cannot be exercised without cutting a real release.
name: gate probe

on:
  push:
    branches: ['chore/todos-47']

permissions:
  contents: read

jobs:
  dogfood:
    name: pre-publish dogfood · node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      # "26 is broken, 22 and 24 are fine" is the useful answer, and it is the answer you
      # most want while deciding whether to cut a release. fail-fast would hide it behind
      # whichever leg died first. Same reasoning as dogfood.yml.
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      # Repeated from the publish job on purpose, not extracted. package.json is committed
      # at a placeholder version (the tag is the source of truth), so without this the gate
      # would pack and smoke an artifact whose version is not the one being released — and
      # the `--version` line in the transcript, the one thing proving WHICH build passed,
      # would name the placeholder.
      - name: Set version from git tag
        run: npm pkg set version="0.0.0-gatetest"

      - run: pnpm install --frozen-lockfile
      - run: pnpm run dogfood:release
