name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24, 26]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run typecheck

      - run: pnpm run build

      - run: pnpm run test:coverage

      # `@types/node` is pinned to the engines.node FLOOR (22), so the typecheck
      # above describes Node 22's API on every leg — including the legs running 24
      # and 26. Anything whose signature CHANGED in a later major goes unchecked;
      # that is how a WebCrypto `BufferSource` narrowing reached main unnoticed —
      # measured invisible under @types/node 22 and 24, caught under 25 and 26.
      # Re-run the typecheck against the typings for the Node THIS leg runs, so
      # the matrix stays the single source of which majors get checked.
      #
      # `@types/node@<major>` is a RANGE, deliberately: it resolves whatever
      # DefinitelyTyped published most recently, so a tightened signature shows up
      # here rather than whenever someone remembers to bump a pin. The cost is that
      # an upstream publish can redden a PR that did not touch the code; reproduce
      # locally with the two commands in CONTRIBUTING.md before hunting a commit.
      # Note DefinitelyTyped cuts a major 5-8 weeks AFTER the Node release and
      # skipped 23 entirely, so a NEWLY added matrix major may have no typings yet;
      # that surfaces as ERR_PNPM_NO_MATCHING_VERSION on the line just edited.
      #
      # Restore the two tracked files `pnpm add` rewrites (package.json and
      # pnpm-lock.yaml, not just node_modules) so this stays safe wherever it sits
      # in the step list — a comment saying "keep me last" cannot enforce itself.
      - name: Typecheck against @types/node ${{ matrix.node-version }}
        run: |
          pnpm add -D "@types/node@${{ matrix.node-version }}"
          pnpm run typecheck
          git checkout -- package.json pnpm-lock.yaml

  confine-macos:
    # The --confine OS sandbox (Seatbelt / sandbox-exec) is macOS-only and cannot
    # be exercised by the ubuntu matrix above. This leg runs the hermetic
    # end-to-end confine dogfood on a real macOS runner so the flagship
    # enforcement path is CI-verified, not just verified locally. The full unit
    # suite is intentionally NOT run here (a couple of tests are darwin-env
    # sensitive); the dogfood is the enforcement contract that matters.
    name: confine dogfood (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm dogfood:confine
